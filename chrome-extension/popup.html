<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhiteCode Meet Sync</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 360px;
      background: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      font-size: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    .title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .meeting-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .info-label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .code-pill {
      font-family: monospace;
      font-weight: bold;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 12px;
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .rec-dot.active {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-success {
      background: #059669;
      color: white;
    }

    .btn-success:hover {
      background: #047857;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .transcript-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      max-height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #cbd5e1;
      line-height: 1.4;
      margin-top: 8px;
    }

    .result-alert {
      display: none;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #a7f3d0;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.3;
    }

    .lang-badge {
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <div class="logo-icon">W</div>
      <div class="title">WhiteCode Meet Sync</div>
    </div>
    <div id="serverBadge" class="status-badge">
      <div class="dot"></div>
      <span id="serverStatusText">Connecting...</span>
    </div>
  </div>

  <div class="card">
    <div class="meeting-info">
      <span class="info-label">Active Meet Code:</span>
      <span id="meetCodePill" class="code-pill">Detecting...</span>
    </div>
    <div class="meeting-info">
      <span class="info-label">Tracking Mode:</span>
      <div class="rec-indicator">
        <div id="recDot" class="rec-dot"></div>
        <span id="recStatusText">Idle</span>
      </div>
    </div>
  </div>

  <button id="trackBtn" class="btn btn-primary">
    <span>🎙️</span> <span id="trackBtnText">Start Discussion Tracking</span>
  </button>

  <button id="finalizeBtn" class="btn btn-success" style="display: none;">
    <span>⚡</span> <span>Finalize & Fill Tasksheet</span>
  </button>

  <button id="viewTasksheetsBtn" class="btn btn-secondary">
    <span>📋</span> <span>Open Tasksheets Dashboard</span>
  </button>

  <div class="card" style="margin-top: 8px; margin-bottom: 4px;">
    <div class="info-label" style="display: flex; justify-content: space-between;">
      <span>Live Bilingual Transcript:</span>
      <span id="charCount" style="color: #6366f1;">0 chars</span>
    </div>
    <div id="transcriptBox" class="transcript-box">Waiting for discussion... English & Marathi speech will appear here.</div>
  </div>

  <div id="resultAlert" class="result-alert"></div>

  <div class="lang-badge">
    🌐 English & Marathi (Mar-glish) Supported • Google Gemini AI
  </div>

  <script src="popup.js"></script>
</body>
</html>
